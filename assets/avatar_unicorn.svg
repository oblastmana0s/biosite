  <circle cx="95" cy="126" r="1.8" fill="#f43f5e"/>
  <circle cx="105" cy="126" r="1.8" fill="#f43f5e"/>
  <path d="M97 131 Q100 134 103 131" stroke="#f43f5e" stroke-width="1.6" stroke-linecap="round" fill="none"/>

