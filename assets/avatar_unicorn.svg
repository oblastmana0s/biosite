  <line x1="95" y1="48" x2="105" y2="44" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="97" y1="34" x2="103" y2="31" stroke="#d97706" stroke-width="1.8" stroke-linecap="round"/>

