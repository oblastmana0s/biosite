  <path d="M152 95 C175 55 178 15 142 25 C125 30 118 65 122 95 Z" fill="#f59e0b"/>
  <path d="M150 88 C168 58 168 28 142 35 C130 40 126 65 128 88 Z" fill="url(#earInner)"/>
  <path d="M158 65 C152 70 148 70 144 65" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8"/>

