  <circle cx="78" cy="110" r="3.2" fill="#ffffff"/>
  <circle cx="83" cy="117" r="1.5" fill="#ffffff"/>

  <ellipse cx="120" cy="114" rx="7.5" ry="9" fill="#292524"/>
  <circle cx="118" cy="110" r="3.2" fill="#ffffff"/>
  <circle cx="123" cy="117" r="1.5" fill="#ffffff"/>

