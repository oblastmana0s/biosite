  <path d="M54 112 C52 125 68 142 82 142 C92 142 98 132 100 125 C102 132 108 142 118 142 C132 142 148 125 146 112 C142 105 130 102 120 102 C110 102 102 108 100 112 C98 108 90 102 80 102 C70 102 58 105 54 112 Z" fill="url(#foxWhite)"/>

