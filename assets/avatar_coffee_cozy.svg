<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="coffeeBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
    <linearGradient id="mugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="latteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Circle Base -->
  <circle cx="100" cy="100" r="98" fill="url(#coffeeBg)" stroke="#ffffff" stroke-width="4"/>

  <!-- Warm Steam swirls with hearts -->
  <path d="M80 50 C75 35 85 25 80 15" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M100 45 C95 30 105 20 100 10" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M120 50 C115 35 125 25 120 15" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Mini Steam Heart -->
  <path d="M100 18 C97 14 92 16 92 20 C92 24 100 28 100 28 C100 28 108 24 108 20 C108 16 103 14 100 18 Z" fill="#f43f5e" opacity="0.6"/>

  <!-- Coffee Saucer / Plate -->
  <ellipse cx="100" cy="165" rx="72" ry="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <ellipse cx="100" cy="164" rx="55" ry="12" fill="#f8fafc"/>

  <!-- Mug Handle -->
  <path d="M135 90 C165 90 165 140 135 140" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M135 90 C165 90 165 140 135 140" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Mug Body -->
  <path d="M55 75 L65 155 Q67 165 82 165 L118 165 Q133 165 135 155 L145 75 Z" fill="url(#mugGrad)" stroke="#e2e8f0" stroke-width="2.5"/>

  <!-- Latte Rim Surface -->
  <ellipse cx="100" cy="75" rx="45" ry="15" fill="url(#latteGrad)"/>

  <!-- Cute Cat Latte Art on Top -->
  <ellipse cx="100" cy="74" rx="34" ry="10" fill="#ffffff" opacity="0.95"/>
  <!-- Cat Ears in Foam -->
  <polygon points="78,70 70,60 84,65" fill="#ffffff"/>
  <polygon points="122,70 130,60 116,65" fill="#ffffff"/>
  <!-- Cat face in foam -->
  <circle cx="92" cy="74" r="1.5" fill="#78350f"/>
  <circle cx="108" cy="74" r="1.5" fill="#78350f"/>
  <path d="M98 76 Q100 78 100 76 Q100 78 102 76" stroke="#78350f" stroke-width="1" stroke-linecap="round" fill="none"/>

  <!-- Mug Face (Kawaii Expression on the ceramic mug) -->
  <ellipse cx="82" cy="115" rx="6.5" ry="8" fill="#334155"/>
  <circle cx="80" cy="112" r="2.8" fill="#ffffff"/>
  <circle cx="84" cy="117" r="1.2" fill="#ffffff"/>

  <ellipse cx="118" cy="115" rx="6.5" ry="8" fill="#334155"/>
  <circle cx="116" cy="112" r="2.8" fill="#ffffff"/>
  <circle cx="120" cy="117" r="1.2" fill="#ffffff"/>

  <!-- Cute rosy cheeks -->
  <ellipse cx="72" cy="122" rx="7" ry="4" fill="#fb7185" opacity="0.55"/>
  <ellipse cx="128" cy="122" rx="7" ry="4" fill="#fb7185" opacity="0.55"/>

  <!-- Happy Smile -->
  <path d="M96 122 Q100 128 104 122" stroke="#334155" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Little Warm Stars -->
  <circle cx="45" cy="100" r="2" fill="#d97706" opacity="0.5"/>
  <circle cx="155" cy="65" r="2.5" fill="#d97706" opacity="0.5"/>
</svg>
