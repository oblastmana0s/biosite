  <path d="M155 78 L155 68 L168 65 L168 75 M155 78 A3 3 0 1 1 150 78 A3 3 0 1 1 155 78 M168 75 A3 3 0 1 1 163 75 A3 3 0 1 1 168 75" fill="#a78bfa" stroke="#a78bfa" stroke-width="1.2"/>

